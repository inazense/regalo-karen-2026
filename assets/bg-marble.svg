<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <radialGradient id="baseGlow" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0f2e20"/>
      <stop offset="45%" stop-color="#08160f"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>

    <filter id="marbleVeins" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="5" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.55
                0 0 0 0 0.62
                0 0 0 0 0.60
                0 0 0 0.9 0" result="veinColor"/>
      <feComposite in="veinColor" in2="SourceGraphic" operator="in" result="veinsClipped"/>
      <feGaussianBlur in="veinsClipped" stdDeviation="0.6" result="veinsSoft"/>
      <feBlend in="veinsSoft" in2="SourceGraphic" mode="screen"/>
    </filter>

    <filter id="marbleVeins2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="3" seed="42" result="noise2"/>
      <feColorMatrix in="noise2" type="matrix"
        values="0 0 0 0 0.05
                0 0 0 0 0.55
                0 0 0 0 0.35
                0 0 0 0.5 0" result="veinColor2"/>
      <feComposite in="veinColor2" in2="SourceGraphic" operator="in" result="veinsClipped2"/>
      <feBlend in="veinsClipped2" in2="SourceGraphic" mode="screen"/>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#3ddc84" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c9d6d0" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#baseGlow)"/>
  <rect width="1600" height="1200" fill="#0a1f16" filter="url(#marbleVeins)"/>
  <rect width="1600" height="1200" fill="#08160f" filter="url(#marbleVeins2)" opacity="0.8"/>
  <rect width="1600" height="1200" fill="url(#sheen)"/>
  <rect width="1600" height="1200" fill="url(#vignette)"/>
</svg>
