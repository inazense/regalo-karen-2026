<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="silverEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f9f6"/>
      <stop offset="25%" stop-color="#b9c9c0"/>
      <stop offset="50%" stop-color="#6d8478"/>
      <stop offset="75%" stop-color="#b9c9c0"/>
      <stop offset="100%" stop-color="#e8f0eb"/>
    </linearGradient>
    <linearGradient id="frameFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2a1c"/>
      <stop offset="50%" stop-color="#06170f"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>
    <pattern id="scales" width="26" height="22" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <rect width="26" height="22" fill="#08190f"/>
      <path d="M0 22 C 4 8 22 8 26 22" fill="none" stroke="#1f6b45" stroke-width="1.4" opacity="0.55"/>
      <path d="M-13 22 C -9 8 9 8 13 22" fill="none" stroke="#1f6b45" stroke-width="1.4" opacity="0.55"/>
      <path d="M13 22 C 17 8 35 8 39 22" fill="none" stroke="#1f6b45" stroke-width="1.4" opacity="0.55"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="runeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dff7ea"/>
      <stop offset="100%" stop-color="#7fae95" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer frame band with scale texture, hollow center -->
  <path fill-rule="evenodd" d="
      M20 20 H780 V980 H20 Z
      M70 70 H730 V930 H70 Z"
      fill="url(#scales)"/>
  <path fill-rule="evenodd" d="
      M20 20 H780 V980 H20 Z
      M70 70 H730 V930 H70 Z"
      fill="url(#frameFill)" opacity="0.25"/>

  <!-- edges -->
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="url(#silverEdge)" stroke-width="4"/>
  <rect x="70" y="70" width="660" height="860" fill="none" stroke="url(#silverEdge)" stroke-width="3"/>

  <!-- corner medallions with runes -->
  <g filter="url(#softGlow)">
    <g transform="translate(45,45)">
      <circle r="26" fill="#08190f" stroke="url(#silverEdge)" stroke-width="3"/>
      <circle r="26" fill="url(#runeGlow)" opacity="0.5"/>
      <path d="M-12 -12 L12 12 M12 -12 L-12 12 M0 -16 L0 16" stroke="#e9fff2" stroke-width="1.6" opacity="0.8"/>
    </g>
    <g transform="translate(755,45)">
      <circle r="26" fill="#08190f" stroke="url(#silverEdge)" stroke-width="3"/>
      <circle r="26" fill="url(#runeGlow)" opacity="0.5"/>
      <path d="M0 -16 L14 8 L-14 8 Z" fill="none" stroke="#e9fff2" stroke-width="1.6" opacity="0.8"/>
    </g>
    <g transform="translate(45,955)">
      <circle r="26" fill="#08190f" stroke="url(#silverEdge)" stroke-width="3"/>
      <circle r="26" fill="url(#runeGlow)" opacity="0.5"/>
      <circle r="10" fill="none" stroke="#e9fff2" stroke-width="1.6" opacity="0.8"/>
      <path d="M-16 0 H16 M0 -16 V16" stroke="#e9fff2" stroke-width="1.2" opacity="0.6"/>
    </g>
    <g transform="translate(755,955)">
      <circle r="26" fill="#08190f" stroke="url(#silverEdge)" stroke-width="3"/>
      <circle r="26" fill="url(#runeGlow)" opacity="0.5"/>
      <path d="M-14 -10 Q0 18 14 -10" fill="none" stroke="#e9fff2" stroke-width="1.6" opacity="0.8"/>
    </g>
  </g>

  <!-- top arch serpents -->
  <g filter="url(#softGlow)" stroke="url(#silverEdge)" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M120 45 C 220 5 300 5 400 22 C 500 5 580 5 680 45"/>
  </g>
  <g fill="url(#silverEdge)">
    <path d="M120 45 c -8 -4 -8 -16 2 -18 c 10 -2 16 6 12 14 c -3 6 -9 7 -14 4 Z"/>
    <circle cx="126" cy="35" r="1.6" fill="#08190f"/>
    <path d="M680 45 c 8 -4 8 -16 -2 -18 c -10 -2 -16 6 -12 14 c 3 6 9 7 14 4 Z"/>
    <circle cx="674" cy="35" r="1.6" fill="#08190f"/>
  </g>

  <!-- bottom rune row -->
  <g fill="#dff7ea" opacity="0.5" font-family="Georgia, serif" font-size="20" text-anchor="middle" letter-spacing="10">
    <text x="400" y="965">☥ ⚶ ✧ ☽ ⚶ ✧ ⚶ ☥</text>
  </g>
</svg>
